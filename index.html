                        value={adminEmailInput}
                        onChange={(e) => { setAdminEmailInput(e.target.value); setAdminMsg(''); }}
                        placeholder="학교 이메일 (예: 123456@ggg.hs.kr)"
                        className="w-full px-3 py-2 rounded-xl border border-[#C8E6C9] bg-white text-xs focus:outline-none focus:ring-2 focus:ring-[#2E7D32]"
                      />
                      <div className="grid grid-cols-2 gap-2">
                        <select
                          value={adminProfileId}
                          onChange={(e) => setAdminProfileId(e.target.value)}
                          className="px-2 py-2 rounded-xl border border-[#C8E6C9] bg-white text-xs"
                        >
                          {counselors.map((c) => (
                            <option key={c.id} value={c.id}>{c.icon} {c.codeName}</option>
                          ))}
                        </select>
                        <select
                          value={adminRoleInput}
                          onChange={(e) => setAdminRoleInput(e.target.value)}
                          className="px-2 py-2 rounded-xl border border-[#C8E6C9] bg-white text-xs"
                        >
                          <option value="member">부원</option>
                          <option value="admin">관리자</option>
                        </select>
                      </div>
                      <button
                        onClick={handleAdminAdd}
                        className="w-full py-2 bg-[#2E7D32] hover:bg-[#1B4332] text-white font-bold rounded-xl text-xs transition"
                      >
                        등록
                      </button>
                      {adminMsg && <p className="text-[11px] font-bold text-[#2E7D32] text-center">{adminMsg}</p>}
                    </div>

                    <div className="space-y-1.5">
                      <p className="text-xs font-bold text-[#1B4332]">등록된 계정 ({adminList.length})</p>
                      {adminList.length === 0 ? (
                        <p className="text-[11px] text-slate-400 text-center py-3">등록된 계정이 없어요.</p>
                      ) : (
                        adminList.map((r) => {
                          const prof = counselors.find((c) => c.id === r.counselorId);
                          return (
                            <div key={r.email} className="flex items-center justify-between gap-2 p-2.5 rounded-2xl border border-[#E8F5E9] bg-white">
                              <div className="min-w-0">
                                <p className="text-xs font-bold text-slate-800 truncate">{r.email}</p>
                                <p className="text-[10px] text-slate-500">
                                  {prof ? `${prof.icon} ${prof.codeName}` : r.counselorId} · {r.role === 'admin' ? '관리자' : '부원'}
                                </p>
                              </div>
                              <button
                                onClick={() => handleAdminRemove(r.email)}
                                className="shrink-0 text-[11px] px-2.5 py-1 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 font-bold hover:bg-rose-100 transition"
                              >
                                삭제
                              </button>
                            </div>
                          );
                        })
                      )}
                    </div>

                    <div className="space-y-1.5">
                      <p className="text-xs font-bold text-[#1B4332]">프로필 초기화 (인수인계용)</p>
                      <p className="text-[10px] text-slate-500">전 기수의 마음 온도와 감사 편지를 비우고 새로 시작해요.</p>
                      <div className="grid grid-cols-2 gap-1.5">
                        {counselors.map((c) => (
                          <button
                            key={c.id}
                            onClick={() => handleResetProfile(c.id)}
                            className={`py-1.5 px-2 rounded-xl border text-[11px] font-bold transition ${
                              resetConfirmId === c.id
                                ? 'bg-rose-600 text-white border-rose-600'
                                : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                            }`}
                          >
                            {resetConfirmId === c.id ? '정말 초기화?' : `${c.icon} ${c.codeName}`}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                ) : counselorViewMode === 'archive' ? (
                  <div className="flex-1 bg-white rounded-3xl border border-[#F8BBD0] shadow-xl p-4 sm:p-5 overflow-y-auto flex flex-col space-y-4">
                    <div className="bg-white p-4 sm:p-5 rounded-3xl border border-[#F8BBD0] flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm">
                      <div className="space-y-1 text-center sm:text-left">
                        <div className="inline-flex items-center gap-1 px-3 py-0.5 rounded-full bg-[#FFF0F5] text-[#D81B60] font-bold text-[11px] border border-[#F8BBD0]">
                          <Icon name="Award" className="w-3.5 h-3.5 text-[#D81B60]" />
                          <span>{loggedInCounselor.codeName} 부원의 감사 아카이브</span>
                        </div>
                        <h3 className="font-bold text-sm sm:text-base text-[#1B4332]">
                          내담자들이 남겨준 따뜻한 응원 편지들 💌
                        </h3>
                      </div>

                      <div className="bg-white px-4 py-3 rounded-2xl border border-[#F8BBD0] text-center shadow-xs shrink-0 flex flex-col items-center gap-0.5">
                        <span className="text-[10px] text-slate-500 font-bold block">누적 마음 온도</span>
                        <span className="text-xl font-black flex items-center gap-1" style={{ color: getHeartColor(loggedInCounselor.heartTemp) }}>
                          <Heart className="w-4 h-4" style={{ fill: getHeartColor(loggedInCounselor.heartTemp), color: getHeartColor(loggedInCounselor.heartTemp) }} />
                          +{loggedInCounselor.heartTemp}℃
                        </span>
                      </div>
                    </div>

                    {(!loggedInCounselor.archiveMessages || loggedInCounselor.archiveMessages.length === 0) ? (
                      <div className="flex-1 flex flex-col items-center justify-center py-12 text-center space-y-2 bg-white rounded-3xl border border-dashed border-[#F8BBD0]">
                        <div className="w-12 h-12 bg-white text-[#D81B60] rounded-2xl flex items-center justify-center text-xl border border-[#F8BBD0]">
                          🌿
                        </div>
                        <h4 className="font-bold text-xs text-[#1B4332]">아직 도착한 감사 편지가 없어요</h4>
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {loggedInCounselor.archiveMessages.map((arch) => (
                          <div 
                            key={arch.id}
                            className="bg-white rounded-3xl p-4 border border-[#F8BBD0] shadow-sm flex flex-col justify-between space-y-3 relative group"
                          >
                            <div className="space-y-2.5">
                              <div className="flex items-center justify-between">
                                <span className="text-[11px] font-bold text-[#1B4332] bg-white px-2.5 py-0.5 rounded-xl border border-[#C8E6C9] flex items-center gap-1">
                                  <span>👤</span> {arch.clientNick}
                                </span>
                                <span className="text-[11px] font-bold text-[#D81B60] bg-white px-2.5 py-0.5 rounded-xl border border-[#F8BBD0] flex items-center gap-1">
                                  <Icon name="Sparkles" className="w-3 h-3" /> +{arch.temp}℃
                                </span>
                              </div>

                              <div className="bg-white p-3 rounded-2xl border border-[#F8BBD0]/60">
                                <p className="text-xs text-slate-700 font-medium leading-relaxed whitespace-pre-wrap">
                                  "{arch.text}"
                                </p>
                              </div>
                            </div>

                            <div className="text-[10px] text-slate-400 pt-2 border-t border-[#F8BBD0]/40 flex justify-between items-center">
                              <span>작성일시</span>
                              <span className="font-semibold text-slate-500">{arch.time}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ) : (
                  /* CHAT VIEW */
                  <div className="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3 h-full overflow-hidden">
                    <div className={`bg-white rounded-3xl border border-[#C8E6C9] shadow-md flex flex-col overflow-hidden h-full ${
                      counselorMobileTab === 'chat' ? 'hidden md:flex' : 'flex'
                    }`}>
                      <div className="px-3.5 py-2 bg-[#E8F5E9]/90 border-b border-[#C8E6C9] text-xs font-bold text-[#2E7D32] flex justify-between items-center shrink-0">
                        <span>상담방 목록</span>
                        <span className="text-[10px] text-slate-500 truncate max-w-[120px]">
                          {loggedInCounselor.statusText || '상시 대기'}
                        </span>
                      </div>

                      <div className="flex-1 overflow-y-auto divide-y divide-[#E8F5E9]">
                        {myCounselorChats.length === 0 ? (
                          <div className="p-4 text-center text-slate-400 text-xs">
                            신청된 상담방이 없습니다.
                          </div>
                        ) : (
                          myCounselorChats.map((chat) => {
                            const isActive = chat.id === activeChatId;
                            const lastMsg = chat.messages[chat.messages.length - 1];
                            return (
                              <div
                                key={chat.id}
                                onClick={() => {
                                  setActiveChatId(chat.id);
                                  setCounselorMobileTab('chat');
                                }}
                                className={`p-3 cursor-pointer transition-all relative group ${
                                  isActive
                                    ? 'bg-[#E8F5E9] border-l-4 border-[#2E7D32]'
                                    : 'hover:bg-[#F3FAF6]'
                                }`}
                              >
                                <div className="flex justify-between items-center mb-1 pr-14">
                                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white text-[#1B4332] border border-[#C8E6C9] shrink-0">
                                    {chat.category.label}
                                  </span>
                                  <span className="text-[9px] text-slate-400">
                                    {typeof chat.createdAt === 'number'
                                      ? new Date(chat.createdAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                                      : chat.createdAt}
                                  </span>
                                </div>

                                <h4 className="font-bold text-xs text-slate-800 my-0.5 truncate pr-14">
                                  💬 {chat.clientNick}
                                </h4>

                                <p className="text-[11px] text-slate-500 line-clamp-1 font-medium">
            <span className="flex items-center gap-1 font-bold text-[#1B4332]">
              <Icon name="PhoneCall" className="w-3 h-3 text-[#2E7D32]" /> 긴급:
            </span>
            <span>청소년전화 1388</span>
            <span>·</span>
            <span>자살예방 1393</span>
          </div>
        </div>
      </footer>
    </div>
  );
}
 
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
